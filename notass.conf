-- notass: notas en el escritorio con la misma estética del conky principal
conky.config = {
    background = true,
    update_interval = 1.0,
    total_run_times = 0,

    double_buffer = true,
    no_buffers = true,
    text_buffer_size = 4096,

    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_class = 'notass',
    own_window_title = 'notass',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    alignment = 'top_right',
    gap_x = 20,
    gap_y = 20,

    minimum_width = 350,
    maximum_width = 450,

    draw_shades = false,
    draw_outline = true,
    draw_borders = true,
    draw_graph_borders = false,

    border_inner_margin = 5,
    border_outer_margin = 15,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=11',
    xftalpha = 0.8,

    override_utf8_locale = true,
    uppercase = false,

    lua_load = os.getenv('HOME') .. '/.config/notass/notass.lua',
};

conky.text = [[
${color grey}${lua notass_banner}
${color grey}time:${color} ${time %H:%M:%S}
${color grey}Notas:${color} ${lua notass_count}

${lua_parse notass_text}
${color grey}${lua notass_banner}
]];
